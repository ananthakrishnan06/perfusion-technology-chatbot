<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#faf8f4">
  <title>Under maintenance | Perfusion AI</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #23221f; background: #faf8f4; }
    body { margin: 0; min-height: 100vh; display: grid; align-items: center; }
    main { width: min(36rem, calc(100% - 3rem)); margin: auto; padding: 3rem 0; }
    .brand { color: #5c503c; font-weight: 650; margin: 0 0 1.5rem; }
    h1 { font-size: clamp(2rem, 7vw, 3.25rem); line-height: 1.08; margin: 0; }
    .detail { color: #5c503c; font-size: 1.125rem; line-height: 1.6; }
    a { display: inline-block; color: #fff; background: #23221f; padding: .75rem 1.1rem;
        border-radius: .5rem; text-decoration: none; font-weight: 650; }
    a:focus-visible { outline: 3px solid #805017; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Perfusion AI</p>
    <h1>Under maintenance</h1>
    <p class="detail">We’re working on the chatbot. Please check back soon.</p>
    <a href="/">Check again</a>
  </main>
</body>
</html>
